name: build
on:
  push:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            bin: rcoffice.exe
          - os: macos-latest
            name: macos-apple-silicon
            bin: rcoffice
          - os: macos-13
            name: macos-intel
            bin: rcoffice
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Tests
        working-directory: app
        run: cargo test --release
      - name: Build
        working-directory: app
        run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: rcoffice-${{ matrix.name }}
          path: app/target/release/${{ matrix.bin }}
