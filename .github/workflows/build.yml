name: build
on:
  push:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Tests
        working-directory: app
        run: cargo test --release
      - name: Build
        working-directory: app
        run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: rcoffice-windows
          path: app/target/release/rcoffice.exe

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Tests
        working-directory: app
        run: cargo test --release
      - name: Build Universal Binary and .app bundle
        run: bash build-mac.sh
      - name: Pack .app as tar.gz (preserves executable bit)
        run: tar -czf "RC-office-macos-universal.tar.gz" "RC office.app"
      - uses: actions/upload-artifact@v4
        with:
          name: rcoffice-macos-universal
          path: RC-office-macos-universal.tar.gz
